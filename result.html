<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antwort 💘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="flower" id="flower" style="display: none;">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <h2 id="message"></h2>

    <!-- WhatsApp Button (anfangs versteckt) -->
    <a id="whatsappBtn" href="#" class="whatsapp-btn" style="display:none;">
      Auf WhatsApp senden 💬
    </a>

    <!-- Return Button -->
    <a href="index.html" class="back-btn" id="returnBtn">
      Zurück zur Frage 💞
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get("answer");

    const message = document.getElementById("message");
    const flower = document.getElementById("flower");
    const whatsappBtn = document.getElementById("whatsappBtn");
    const returnBtn = document.getElementById("returnBtn");

    let answerText = "";

    if (type === "yes1") {
      message.textContent = 
        "Ich freue mich 😍♥️🌹 Dann wie wäre es mit 19:30 bei mir zuhause? 😌";

      flower.style.display = "block";
      whatsappBtn.style.display = "inline-block";
      returnBtn.style.display = "none";

      answerText = "Wohoooo, auf jeden Fall 💕";

    } else if (type === "yes2") {
      message.textContent = 
        "Ich hätte mir etwas mehr Enthusiasmus gewünscht, versuch es noch mal! 😄";

      flower.style.display = "none";
      whatsappBtn.style.display = "none";
      returnBtn.style.display = "inline-block";

      answerText = "JAAA 💖";

    } else {
      message.textContent = "Unbekannte Antwort 💭";

      flower.style.display = "none";
      whatsappBtn.style.display = "none";
      returnBtn.style.display = "inline-block";

      answerText = "Hey 💕";
    }

    const phoneNumber = "4917632371605";

    if (whatsappBtn.style.display !== "none") {
      const text = encodeURIComponent(`"${answerText}" 💌`);
      whatsappBtn.href = `https://wa.me/${phoneNumber}?text=${text}`;
    }
  </script>
</body>
</html>
